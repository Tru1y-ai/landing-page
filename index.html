<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truly — Hire for the work, not the interview.</title>
    <meta name="description" content="Truly turns your job description into a job-specific work simulation. Candidates work on their own machine — AI evaluators turn the full session into evidence you can hire on." />

    <!-- Social cards. og:image is the logo as a stopgap; it wants a purpose-made
         1200x630 so shared links render a proper wide card rather than a crop.
         The image URL must be absolute — scrapers fetch it without a document
         base, so a root-relative path resolves against their own host and the
         card renders with no image at all. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Truly" />
    <meta property="og:title" content="Hire for the work, not the interview." />
    <meta property="og:description" content="Job-specific work simulations. Candidates work on their own machine — AI evaluators turn the full session into evidence you can hire on." />
    <meta property="og:image" content="https://trulyta.com/truly-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hire for the work, not the interview." />
    <meta name="twitter:description" content="Job-specific work simulations. Candidates work on their own machine — AI evaluators turn the full session into evidence you can hire on." />
    <meta name="twitter:image" content="https://trulyta.com/truly-logo.png" />
    <meta name="theme-color" content="#04212F" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
