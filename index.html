<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- These three faces used to arrive via `@import` at the top of index.css,
         which cannot start until the stylesheet has been fetched and parsed —
         two extra serial round trips in front of the headline, which is
         Newsreader. Requesting them here lets them go out with the stylesheet.
         Same families, same display=swap, so nothing about rendering changes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" />
    <title>Truly — Hire for the work, not the interview.</title>
    <meta name="description" content="Truly turns your job description into a job-specific work simulation. Candidates work on their own machine; AI evaluators turn it into hiring evidence." />

    <!-- One page, one address. Without this, trulyta.com/, /?utm_source=…,
         and the tru1y-ai.github.io origin are three URLs serving identical
         content and the ranking signals split between them. -->
    <!-- The poster is the hero's first paint, and the 3.8 MB film alongside it
         is requested with preload="auto". Without this the poster queues behind
         that download; the preload just reorders the two, it changes nothing
         about what renders. -->
    <link rel="preload" as="image" href="/hero-poster.jpg" fetchpriority="high" />

    <link rel="canonical" href="https://trulyta.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Social cards. og.jpg is a purpose-made 1200x630 built from the same
         brand tokens as the site (see the hero mesh recipe in index.css), so
         a shared link renders a proper wide card rather than a crop of the
         square logo. The URL must be absolute — scrapers fetch it without a
         document base, so a root-relative path resolves against their own
         host and the card renders with no image at all. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Truly" />
    <meta property="og:url" content="https://trulyta.com/" />
    <meta property="og:title" content="Truly — Hire for the work, not the interview." />
    <meta property="og:description" content="Job-specific work simulations. Candidates work on their own machine — AI evaluators turn the full session into evidence you can hire on." />
    <meta property="og:image" content="https://trulyta.com/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Truly — hire for the work, not the interview." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Truly — Hire for the work, not the interview." />
    <meta name="twitter:description" content="Job-specific work simulations. Candidates work on their own machine — AI evaluators turn the full session into evidence you can hire on." />
    <meta name="twitter:image" content="https://trulyta.com/og.jpg" />
    <meta name="twitter:image:alt" content="Truly — hire for the work, not the interview." />
    <meta name="theme-color" content="#14563E" />

    <!-- The build prerenders the whole page into the mount below
         (scripts/prerender.js), so the copy is in the document itself for the
         crawlers that never run JS — most AI crawlers included. These blocks
         restate the same facts in machine-readable form.
         The Q&A text is copied verbatim from src/components/Faq.jsx —
         structured data that does not match the visible page is a violation,
         so if the FAQ copy changes, this has to change with it.
         FAQPage earns no SERP feature since Google retired FAQ rich results in
         May 2026; it stays as plain description, not for display. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://trulyta.com/#org",
          "name": "Truly",
          "legalName": "Truly, Inc.",
          "url": "https://trulyta.com/",
          "logo": "https://trulyta.com/truly-logo.png",
          "description": "Truly turns a job description into a job-specific work simulation, then turns the recorded session into rubric-scored, evidence-backed hiring reports."
        },
        {
          "@type": "WebSite",
          "@id": "https://trulyta.com/#website",
          "url": "https://trulyta.com/",
          "name": "Truly",
          "publisher": { "@id": "https://trulyta.com/#org" }
        },
        {
          "@type": "SoftwareApplication",
          "name": "Truly",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "url": "https://trulyta.com/",
          "publisher": { "@id": "https://trulyta.com/#org" },
          "description": "Job-specific work simulations for hiring. Candidates work on their own machine; AI evaluators analyze the full session and return rubric-scored, evidence-backed reports.",
          "offers": [
            {
              "@type": "Offer",
              "name": "Starter",
              "priceCurrency": "USD",
              "priceSpecification": {
                "@type": "UnitPriceSpecification",
                "price": "99",
                "priceCurrency": "USD",
                "referenceQuantity": { "@type": "QuantitativeValue", "value": "1", "unitCode": "MON" }
              }
            },
            {
              "@type": "Offer",
              "name": "Pro",
              "priceCurrency": "USD",
              "priceSpecification": {
                "@type": "UnitPriceSpecification",
                "price": "399",
                "priceCurrency": "USD",
                "referenceQuantity": { "@type": "QuantitativeValue", "value": "1", "unitCode": "MON" }
              }
            }
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "https://trulyta.com/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How is each assessment created?",
              "acceptedAnswer": { "@type": "Answer", "text": "Truly generates a role-specific work simulation directly from your job posting — using its description, seniority level, and stack. Instead of pulling from a static library, every candidate gets a task that mirrors the actual job." }
            },
            {
              "@type": "Question",
              "name": "Where do candidates work?",
              "acceptedAnswer": { "@type": "Answer", "text": "On their own machine, in their own setup. Running the assessment locally captures a far more realistic workflow than a browser sandbox — the tools, shortcuts, and environment they actually use to ship." }
            },
            {
              "@type": "Question",
              "name": "What exactly gets captured?",
              "acceptedAnswer": { "@type": "Answer", "text": "The full work session: prompts, actions, edits, debugging, and decision-making — plus collaboration signals like PR-style review, messaging, and handoffs. You see the whole process, not just the final output." }
            },
            {
              "@type": "Question",
              "name": "How is AI usage scored?",
              "acceptedAnswer": { "@type": "Answer", "text": "We measure how candidates work in modern AI-assisted environments. Every AI interaction is logged and scored for prompt quality and iteration — we grade fluency, not abstinence." }
            },
            {
              "@type": "Question",
              "name": "What do I get at the end?",
              "acceptedAnswer": { "@type": "Answer", "text": "A structured, hiring-ready report with rubric-based scores and evidence, ranked across your applicant pool. Candidates keep a reusable profile of verified work artifacts they can carry across applications." }
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
